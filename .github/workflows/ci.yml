name: CI

on:
  workflow_call:
    inputs:
      tested_sha:
        description: Exact release commit to verify
        required: false
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - chore/fast-api

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ inputs.tested_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
      - name: Install test and export tooling
        run: pip install poetry==2.3.1 poetry-plugin-export==1.10.0
      - run: poetry install --no-interaction --no-root
      - name: Verify production dependency lock
        run: |
          poetry export --only main --format requirements.txt --output /tmp/requirements.lock.generated
          diff --unified requirements.lock /tmp/requirements.lock.generated
      - name: Lint backend
        run: >-
          poetry run ruff check app scripts/check_regression_baseline.py
          tests/test_fastapi_deployment.py tests/test_dockerfile_packaging.py tests/test_regression_checker.py
          tests/conftest.py tests/test_offline_geonames.py
      - name: Test FastAPI and packaging
        run: poetry run pytest -o addopts='' tests/test_fastapi_deployment.py tests/test_dockerfile_packaging.py
      - name: Test regression checker and offline GeoNames
        run: poetry run pytest -o addopts='' tests/test_regression_checker.py tests/test_offline_geonames.py
      - name: Test compatible existing suite
        run: >-
          poetry run pytest -o addopts=''
          tests/test_relationship_breakdown.py
          tests/test_moon_phase_contract.py
          tests/test_birth_chart_style.py
          tests/test_chart_config_style.py
      - name: Verify exact PR base and reject regressions
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/run_regression_gate.sh pr "${SOURCE_REVISION}" "${EXPECTED_BASE_SHA}"
      - name: Verify baseline ancestry and reject regressions
        if: github.event_name != 'pull_request'
        run: scripts/run_regression_gate.sh ancestor "${SOURCE_REVISION}"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: kerykeion-kabalah:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            REVISION=${{ env.SOURCE_REVISION }}
      - name: Smoke test production image
        run: scripts/smoke_test_container.sh kerykeion-kabalah:ci ci "${SOURCE_REVISION}"
