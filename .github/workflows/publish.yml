name: Publish container

on:
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.ref.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: ref
        name: Require a release tag from the approved backend branch
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          release_sha=$(git rev-parse "${GITHUB_REF}^{commit}")
          git fetch --no-tags origin refs/heads/chore/fast-api:refs/remotes/origin/chore/fast-api
          git merge-base --is-ancestor "$release_sha" refs/remotes/origin/chore/fast-api
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate-ref
    uses: ./.github/workflows/ci.yml
    with:
      tested_sha: ${{ needs.validate-ref.outputs.release_sha }}
    permissions:
      contents: read

  publish:
    needs: [validate-ref, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/raydevkit/kerykeion-kabalah
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.validate-ref.outputs.release_sha }}
            type=raw,value=${{ github.ref_name }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ needs.validate-ref.outputs.release_sha }}
